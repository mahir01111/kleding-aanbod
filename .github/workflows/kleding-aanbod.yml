name: Kleding-aanbod per e-mail

on:
  schedule:
    # Los van Mercedes; controle om 05:43 en 17:43 UTC, maximaal eens per 72 uur echt zoeken.
    - cron: '43 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: kleding-aanbod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  zoeken-en-mailen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserveer maximaal 10 kledingruns per maand
        id: reserve
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python reserve-clothing-run.py
      - name: Sla kledingreservering op
        if: steps.reserve.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-state.json
          git commit -m "Reserveer kledingrun ${{ steps.reserve.outputs.run_number }}"
          git push
      - name: Installeer pakket
        if: steps.reserve.outputs.allowed == 'true'
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Zoek en filter kleding
        if: steps.reserve.outputs.allowed == 'true'
        run: python find-clothing.py
      - name: Beoordeel via gratis AI met lokale fallback
        if: steps.reserve.outputs.allowed == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.CLOTHING_OPENROUTER_API_KEY }}
        run: python select-clothing.py
      - name: Maak mobielvriendelijk overzicht
        id: report
        if: steps.reserve.outputs.allowed == 'true'
        run: python make-report.py
      - name: Mail alleen bij nieuw aanbod of prijsdaling
        if: steps.reserve.outputs.allowed == 'true' && steps.report.outputs.should_send == 'true'
        env:
          CLOTHING_RESEND_API_KEY: ${{ secrets.CLOTHING_RESEND_API_KEY }}
          CLOTHING_MAIL_TO: ${{ secrets.CLOTHING_MAIL_TO }}
        run: python send-email.py
      - name: Registreer succesvolle kledingrun
        if: steps.reserve.outputs.allowed == 'true'
        run: |
          python mark-success.py
          git add cloud-state.json listing-history.json
          git commit -m "Registreer kledingrun" || true
          git push
